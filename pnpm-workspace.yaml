# packages allowed to run install scripts
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# TODO: wait for deepmerge release
#minimumReleaseAgeExclude:
#  - deepmerge@4.3.2

# security fixes for transitive dependencies (see `pnpm audit`)
overrides:
  # forced to a single major for all dependents
  ajv: ^6.14.0
  flatted: ^3.4.2
  glob: ^14.0.2
  handlebars: ^4.7.10
  js-yaml: ^3.15.2
  picomatch: ^4.0.4
  postcss: ^8.5.25
  sharp: ^0.35.4
  yaml: ^2.8.3
  zod: ^4.6.6
  # patched within the same major
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  brace-expansion@5: ^5.0.11
  "minimatch@>=7 <11.0.1": ^11.0.1
  nanoid@3: ^3.3.18
  source-map-js@1: ^1.2.2
  undici@7: ^7.29.1
#  deepmerge@>=4.2.0 <=4.3.1: ^4.3.2
